<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchMyCareer</title>
    <style>
        :root {
            --bg-color: #0b1220;
            --card-bg: #111c36;
            --header-bg: #0f1b33;
            --primary: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --btn-hover: #1e293b;
        }

        body {
            font-family: 'Helvetica', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 400px;
            min-height: 700px;
            background-color: var(--bg-color);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            padding: 20px;
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Content Area */
        .content {
            padding: 20px;
        }

        /* Reusable Components */
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .btn-outline {
            background: var(--btn-hover);
            color: white;
            border: 2px solid white;
            padding: 15px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 45%;
            margin: 5px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--bg-color);
            border: none;
            padding: 12px 25px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-back {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            background: var(--card-bg);
            border: 1px solid #1e293b;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .hidden { display: none; }

        .job-item {
            border-bottom: 1px solid #1e293b;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terms-box {
            height: 200px;
            overflow-y: scroll;
            background: var(--card-bg);
            padding: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-radius: 4px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>MatchMyCareer</header>
    <div id="main-content" class="content"></div>
</div>

<script>
    const jobDatabase = {
        "BSIT": [
            {"company": "Google", "role": "Software Developer", "type": "Remote"},
            {"company": "Google", "role": "Cloud Architect", "type": "Hybrid"},
            {"company": "Accenture", "role": "Data Analyst", "type": "Hybrid"},
            {"company": "Accenture", "role": "Systems Admin", "type": "On-site"},
            {"company": "Meta", "role": "Web Developer", "type": "On-site"}
        ],
        "BSTM": [
            {"company": "Expedia", "role": "Travel Consultant", "type": "Remote"},
            {"company": "PAL", "role": "Flight Attendant", "type": "On-site"},
            {"company": "Agoda", "role": "Tourism Officer", "type": "Hybrid"}
        ],
        "BSHM": [
            {"company": "Marriott", "role": "Hotel Manager", "type": "On-site"},
            {"company": "Hilton", "role": "Front Desk Officer", "type": "On-site"},
            {"company": "Viking", "role": "Chef de Partie", "type": "On-site"}
        ],
        "HRDM": [
            {"company": "McDonald's", "role": "HR Generalist", "type": "On-site"},
            {"company": "McDonald's", "role": "Recruitment Specialist", "type": "Hybrid"},
            {"company": "IBM", "role": "HR Specialist", "type": "Hybrid"},
            {"company": "LinkedIn", "role": "Recruiter", "type": "Remote"},
            {"company": "Oracle", "role": "Training Coordinator", "type": "On-site"}
        ]
    };

    const contentDiv = document.getElementById('main-content');

    // View: Home
    function showHome() {
        contentDiv.innerHTML = `
            <div class="card">
                <h3>Choose how you want to proceed:</h3>
                <p style="color: var(--text-muted)">Select one only.</p>
                <div style="display: flex; justify-content: center;">
                    <button class="btn-outline" onclick="showUpload()">Insert Resume</button>
                    <button class="btn-outline" onclick="showForm()">Make a Resume</button>
                </div>
            </div>
        `;
    }

    // View: Upload Center
    function showUpload() {
        contentDiv.innerHTML = `
            <h2 style="color: var(--primary); text-align:center">Upload Center</h2>
            <div class="card" style="border: 1px dashed var(--primary); text-align:center; padding: 40px 20px;">
                <p>Select PDF or Docx file</p>
            </div>
            <button class="btn-primary" onclick="processAnalysis('HRDM')">Submit File</button>
            <button class="btn-back" onclick="showHome()">← Back</button>
        `;
    }

    // View: Resume Form
    function showForm() {
        contentDiv.innerHTML = `
            <h2 style="color: var(--primary); text-align:center">Resume Builder</h2>
            <label>First Name</label><input type="text">
            <label>Surname</label><input type="text">
            <label>Email Address</label><input type="email">
            <label>Skills</label><input type="text">
            <label>Course</label>
            <select id="courseSelect">
                <option value="BSIT">BSIT</option>
                <option value="BSTM">BSTM</option>
                <option value="BSHM">BSHM</option>
                <option value="HRDM">HRDM</option>
            </select>
            <button class="btn-primary" onclick="handleFormSubmit()">Submit</button>
            <button class="btn-back" onclick="showHome()">← Back</button>
        `;
    }

    // Logic: Handling redirection
    function processAnalysis(course) {
        contentDiv.innerHTML = `<div style="text-align:center; margin-top:100px;">
            <h3 style="color: var(--primary)">Analyzing Resume...</h3>
        </div>`;
        setTimeout(() => showCompanyList(course), 2000);
    }

    function handleFormSubmit() {
        const course = document.getElementById('courseSelect').value;
        showCompanyList(course);
    }

    // View: Company List
    function showCompanyList(course) {
        const jobs = jobDatabase[course];
        const companies = [...new Set(jobs.map(j => j.company))].sort();

        let html = `
            <h2 style="color: var(--primary); margin-bottom:5px;">Available Companies</h2>
            <p style="color: var(--text-muted); margin-bottom:20px;">Matches for ${course}</p>
        `;

        companies.forEach(company => {
            html += `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:bold">${company}</span>
                    <button class="btn-primary" style="width:auto; margin:0;" onclick="showJobRoles('${course}', '${company}')">View Work</button>
                </div>
            `;
        });

        html += `<button class="btn-back" onclick="showHome()">← Back</button>`;
        contentDiv.innerHTML = html;
    }

    // View: Job Roles
    function showJobRoles(course, company) {
        const jobs = jobDatabase[course].filter(j => j.company === company);

        let html = `<h2 style="color: var(--primary)">Work at ${company}</h2>`;

        jobs.forEach(job => {
            html += `
                <div class="card">
                    <div style="color: var(--primary); font-size: 0.8rem; font-weight:bold;">${job.company.toUpperCase()}</div>
                    <div style="font-size: 1.2rem; font-weight:bold; margin: 5px 0;">${job.role}</div>
                    <div style="color: var(--text-muted); font-size: 0.9rem;">Type: ${job.type}</div>
                    <button class="btn-primary" onclick='showTerms(${JSON.stringify(job)})'>Apply</button>
                </div>
            `;
        });

        html += `<button class="btn-back" onclick="showCompanyList('${course}')">← Back to Companies</button>`;
        contentDiv.innerHTML = html;
    }

    // View: Terms
    function showTerms(job) {
        contentDiv.innerHTML = `
            <h3 style="color: var(--primary)">Terms and Conditions</h3>
            <div class="terms-box">
                <strong>Application for: ${job.role} at ${job.company}</strong><br><br>
                <strong>By accessing and using the company’s Application System, all employees agree to comply with the following terms and conditions:</strong><br><br>
                1. Responsibility for Communication<br>
                Employees are responsible for regularly checking their registered email accounts, system notifications, and messages within the Application System. Important announcements, schedules, updates, approvals, and work-related instructions may be communicated through these channels. Failure to review messages or emails shall not be accepted as a valid reason for missed tasks, deadlines, or notices.<br>
                2. Account Security<br>
                Employees must keep their login credentials confidential and must not share their usernames or passwords with others. Any activity performed using an employee’s account will be considered the responsibility of the account owner.<br>
                3. Accurate Information<br>
                Employees are required to provide accurate, complete, and updated personal and work-related information in the system. Any changes to contact details, email addresses, or other important information must be updated immediately.<br>
                4. Proper Use of the System<br>
                The Application System must only be used for authorized company-related purposes. Employees must not misuse the system, upload harmful content, attempt unauthorized access, or engage in activities that may disrupt system operations.<br>
                5. Compliance with Company Policies<br>
                All employees must follow company rules, regulations, and policies while using the system. Any violation may result in disciplinary action, suspension of system access, or other appropriate sanctions.<br>
                6. Data Privacy<br>
                Employees must protect confidential company information and personal data accessed through the system. Unauthorized sharing, copying, or disclosure of sensitive information is strictly prohibited.<br>
                7. System Maintenance and Downtime<br>
                The company reserves the right to temporarily suspend or limit access to the system for maintenance, updates, or security purposes. Employees are encouraged to complete important tasks ahead of deadlines whenever possible.<br>
                8. Acceptance of Terms<br>
                By using the Application System, employees acknowledge that they have read, understood, and agreed to these Terms and Conditions. Continued use of the system indicates acceptance of all policies stated above.<br>
                <strong>These Terms and Conditions are established to ensure the proper, secure, and responsible use of the Application System by all employees. By following these guidelines, employees help maintain effective communication, protect company information, and support smooth workplace operations. Employees are expected to remain informed by regularly checking their messages and emails and by using the system responsibly at all times.</strong>
            </div>
            <div style="margin-bottom:15px;">
                <input type="checkbox" id="agree" style="width:auto;">
                <label for="agree" style="color: var(--primary); font-size:0.9rem;">I have read and agree to the terms</label>
            </div>
            <button class="btn-primary" onclick="processApplication()">Confirm Application</button>
        `;
    }

    function processApplication() {
        if(!document.getElementById('agree').checked) {
            alert("Please agree to the terms first!");
            return;
        }
        contentDiv.innerHTML = `<div style="text-align:center; margin-top:100px;">
            <h3 style="color: var(--primary)">Processing Application...</h3>
        </div>`;
        setTimeout(showThankYou, 2000);
    }

    function showThankYou() {
        contentDiv.innerHTML = `
            <div style="text-align:center; margin-top:100px;">
                <h1 style="color: var(--primary)">Success!</h1>
                <h3>Thank you for applying!</h3>
                <p style="color: var(--text-muted)">Please wait for the results.<br>Recruiters will contact you via email.</p>
                <button class="btn-primary" onclick="showHome()" style="margin-top:30px;">Done</button>
            </div>
        `;
    }

    // Initialize
    showHome();
</script>

</body>
</html>
